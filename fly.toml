# fly.toml app configuration file generated for gracewood-drive on 2026-04-11T11:26:44-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gracewood-drive'
primary_region = 'sjc'

[build]
  [build.args]
    NEXT_PUBLIC_APP_URL = "https://drive.gracewoodlabs.com"

[deploy]
  release_command = "node packages/database/migrate-prod.js"
  strategy = "rolling"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/login"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
